# AeroSpace config modeled on Omarchy's Hyprland defaults.
# See: https://github.com/basecamp/omarchy/tree/quattro/default/hypr
# Command and Hyper navigation adapted from Eddie Dale's macOS setup:
# https://www.eddiedale.com/blog/my-mac-tiling-setup-inspired-by-omarchy
# Hyper = Caps Lock via Karabiner (cmd + ctrl + alt + shift).
#
# Modifier mapping (matches physical key positions on a Mac keyboard):
#   Omarchy SUPER -> alt (option)
#   Omarchy ALT   -> cmd
#   SHIFT and CTRL are unchanged.

# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

# Keep all nine primary workspaces available for keyboard navigation.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# Reload on save, like Hyprland.
auto-reload-config = true

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
# Opposite orientation for nested containers approximates Hyprland's dwindle layout.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes, like Hyprland's
# cursor.warp_on_change_workspace.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# Let exec-and-forget commands find Homebrew binaries such as aerospace.
[exec.env-vars]
    PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

[key-mapping]
    preset = 'qwerty'

# Omarchy uses gaps_in = 5 (per window, so 10 between windows) and gaps_out = 10.
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     10
    outer.top =        10
    outer.right =      10

[mode.main.binding]

    # Eddie's navigation. Existing Option shortcuts remain available below.
    cmd-left = 'focus --boundaries-action wrap-around-the-workspace left'
    cmd-down = 'focus --boundaries-action wrap-around-the-workspace down'
    cmd-up = 'focus --boundaries-action wrap-around-the-workspace up'
    cmd-right = 'focus --boundaries-action wrap-around-the-workspace right'

    cmd-shift-left = 'move left'
    cmd-shift-down = 'move down'
    cmd-shift-up = 'move up'
    cmd-shift-right = 'move right'

    cmd-equal = 'resize width +32'
    cmd-minus = 'resize width -32'
    cmd-shift-equal = 'resize height +32'
    cmd-shift-minus = 'resize height -32'
    cmd-j = 'layout horizontal vertical'

    cmd-1 = 'workspace 1'
    cmd-2 = 'workspace 2'
    cmd-3 = 'workspace 3'
    cmd-4 = 'workspace 4'
    cmd-5 = 'workspace 5'
    cmd-6 = 'workspace 6'
    cmd-7 = 'workspace 7'
    cmd-8 = 'workspace 8'
    cmd-9 = 'workspace 9'

    cmd-pageUp = 'workspace prev'
    cmd-pageDown = 'workspace next'
    cmd-home = 'workspace 1'
    cmd-end = 'workspace 9'

    cmd-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    cmd-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    cmd-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    cmd-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
    cmd-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
    cmd-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
    cmd-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
    cmd-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
    cmd-shift-9 = 'move-node-to-workspace --focus-follows-window 9'

    cmd-ctrl-alt-shift-d = 'flatten-workspace-tree'
    cmd-ctrl-alt-shift-f = 'layout floating tiling'
    cmd-ctrl-alt-shift-m = 'mode merge'
    cmd-ctrl-alt-shift-w = 'mode workspace'
    cmd-ctrl-alt-shift-r = 'mode resize'

    # Applications (omarchy default/hypr/bindings/applications.lua)
    alt-enter = '''exec-and-forget osascript -e 'tell application "Ghostty"' -e 'new window' -e 'activate' -e 'end tell' '''
    alt-cmd-enter = '''exec-and-forget osascript -e 'tell application "Ghostty"' -e 'set cfg to new surface configuration' -e 'set initial input of cfg to "exec tmux new-session -A -s Work\n"' -e 'new window with configuration cfg' -e 'activate' -e 'end tell' '''
    alt-shift-enter = 'exec-and-forget open -na "Google Chrome" --args --new-window'
    alt-shift-b = 'exec-and-forget open -na "Google Chrome" --args --new-window'
    alt-shift-cmd-b = 'exec-and-forget open -na "Google Chrome" --args --incognito'
    alt-shift-f = 'exec-and-forget open ~'
    alt-shift-n = '''exec-and-forget osascript -e 'tell application "Ghostty"' -e 'set cfg to new surface configuration' -e 'set initial input of cfg to "exec nvim\n"' -e 'new window with configuration cfg' -e 'activate' -e 'end tell' '''
    alt-shift-m = 'exec-and-forget open -a Spotify'
    alt-shift-g = 'exec-and-forget open -a Signal'
    alt-shift-slash = 'exec-and-forget open -a 1Password'

    # Web apps, opened as Chrome app windows like omarchy-launch-webapp
    alt-shift-a = 'exec-and-forget open -na "Google Chrome" --args --app=https://chatgpt.com'
    alt-shift-cmd-a = 'exec-and-forget open -na "Google Chrome" --args --app=https://grok.com'
    alt-shift-c = 'exec-and-forget open -na "Google Chrome" --args --app=https://app.hey.com/calendar/weeks/'
    alt-shift-e = 'exec-and-forget open -na "Google Chrome" --args --app=https://app.hey.com'
    alt-shift-cmd-e = 'exec-and-forget open -na "Google Chrome" --args "--app=https://app.hey.com/messages/new?display=standalone&new_window=true"'
    alt-shift-y = 'exec-and-forget open -na "Google Chrome" --args --app=https://youtube.com/'
    alt-shift-cmd-g = 'exec-and-forget open -na "Google Chrome" --args --app=https://web.whatsapp.com/'
    alt-shift-ctrl-g = 'exec-and-forget open -na "Google Chrome" --args --app=https://messages.google.com/web/conversations'
    alt-shift-p = 'exec-and-forget open -na "Google Chrome" --args --app=https://photos.google.com/'
    alt-shift-s = 'exec-and-forget open -na "Google Chrome" --args --app=https://maps.google.com/'
    alt-shift-x = 'exec-and-forget open -na "Google Chrome" --args --app=https://x.com/'
    alt-shift-cmd-x = 'exec-and-forget open -na "Google Chrome" --args --app=https://x.com/compose/post'

    # Windows (omarchy default/hypr/bindings/tiling.lua)
    alt-w = 'close --quit-if-last-window'
    alt-q = 'close --quit-if-last-window'
    # Hyprland closes every window; AeroSpace can only target the focused workspace.
    ctrl-cmd-backspace = ['close-all-windows-but-current', 'close --quit-if-last-window']

    alt-j = 'layout horizontal vertical'
    alt-t = 'layout floating tiling'
    alt-f = 'fullscreen --no-outer-gaps'
    alt-cmd-f = 'fullscreen'
    # Closest match to switching the workspace between dwindle and scrolling.
    alt-l = ['flatten-workspace-tree', 'layout tiles accordion']

    alt-left = 'focus left'
    alt-down = 'focus down'
    alt-up = 'focus up'
    alt-right = 'focus right'

    alt-shift-left = 'swap left'
    alt-shift-down = 'swap down'
    alt-shift-up = 'swap up'
    alt-shift-right = 'swap right'

    # Resize by 100, 25 (with cmd), or 300 (with ctrl) pixels.
    alt-minus = 'resize width -100'
    alt-equal = 'resize width +100'
    alt-shift-minus = 'resize height -100'
    alt-shift-equal = 'resize height +100'
    alt-cmd-minus = 'resize width -25'
    alt-cmd-equal = 'resize width +25'
    alt-shift-cmd-minus = 'resize height -25'
    alt-shift-cmd-equal = 'resize height +25'
    alt-ctrl-minus = 'resize width -300'
    alt-ctrl-equal = 'resize width +300'
    alt-shift-ctrl-minus = 'resize height -300'
    alt-shift-ctrl-equal = 'resize height +300'

    # Groups map to accordion containers.
    alt-g = 'layout accordion tiles'
    alt-cmd-left = 'join-with left'
    alt-cmd-down = 'join-with down'
    alt-cmd-up = 'join-with up'
    alt-cmd-right = 'join-with right'
    alt-cmd-tab = 'focus --boundaries-action wrap-around-the-workspace dfs-next'
    alt-cmd-shift-tab = 'focus --boundaries-action wrap-around-the-workspace dfs-prev'
    alt-ctrl-left = 'focus --boundaries-action wrap-around-the-workspace dfs-prev'
    alt-ctrl-right = 'focus --boundaries-action wrap-around-the-workspace dfs-next'

    # Workspaces
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 10'

    alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
    alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
    alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
    alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
    alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
    alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
    alt-shift-0 = 'move-node-to-workspace --focus-follows-window 10'

    alt-shift-cmd-1 = 'move-node-to-workspace 1'
    alt-shift-cmd-2 = 'move-node-to-workspace 2'
    alt-shift-cmd-3 = 'move-node-to-workspace 3'
    alt-shift-cmd-4 = 'move-node-to-workspace 4'
    alt-shift-cmd-5 = 'move-node-to-workspace 5'
    alt-shift-cmd-6 = 'move-node-to-workspace 6'
    alt-shift-cmd-7 = 'move-node-to-workspace 7'
    alt-shift-cmd-8 = 'move-node-to-workspace 8'
    alt-shift-cmd-9 = 'move-node-to-workspace 9'
    alt-shift-cmd-0 = 'move-node-to-workspace 10'

    # Scratchpad is workspace S; the toggle returns to the previous workspace.
    alt-s = '''exec-and-forget if [ "$(aerospace list-workspaces --focused)" = S ]; then aerospace workspace-back-and-forth; else aerospace workspace S; fi'''
    alt-backtick = '''exec-and-forget if [ "$(aerospace list-workspaces --focused)" = S ]; then aerospace workspace-back-and-forth; else aerospace workspace S; fi'''
    alt-cmd-s = 'move-node-to-workspace S'
    alt-shift-backtick = 'move-node-to-workspace S'

    alt-tab = 'workspace --wrap-around next'
    alt-shift-tab = 'workspace --wrap-around prev'
    alt-ctrl-tab = 'workspace-back-and-forth'

    # Monitors
    alt-shift-cmd-left = 'move-workspace-to-monitor left'
    alt-shift-cmd-down = 'move-workspace-to-monitor down'
    alt-shift-cmd-up = 'move-workspace-to-monitor up'
    alt-shift-cmd-right = 'move-workspace-to-monitor right'
    ctrl-cmd-tab = 'focus-monitor --wrap-around next'
    ctrl-cmd-shift-tab = 'focus-monitor --wrap-around prev'

    # Utilities (omarchy default/hypr/bindings/utilities.lua)
    alt-ctrl-l = '''exec-and-forget osascript -e 'tell application "System Events" to keystroke "q" using {control down, command down}' '''

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

# Release Hyper after entering a mode, then use the arrow keys.
[mode.merge.binding]
    space = 'mode main'
    esc = 'mode main'
    left = ['join-with left', 'mode main']
    down = ['join-with down', 'mode main']
    up = ['join-with up', 'mode main']
    right = ['join-with right', 'mode main']

[mode.resize.binding]
    space = 'mode main'
    esc = 'mode main'
    left = 'resize width -16'
    down = 'resize height -16'
    up = 'resize height +16'
    right = 'resize width +16'
    shift-left = 'resize width -64'
    shift-down = 'resize height -64'
    shift-up = 'resize height +64'
    shift-right = 'resize width +64'

[mode.workspace.binding]
    space = 'mode main'
    esc = 'mode main'
    left = ['workspace prev', 'move-mouse window-force-center']
    right = ['workspace next', 'move-mouse window-force-center']
    up = ['focus-monitor prev', 'move-mouse window-force-center']
    down = ['focus-monitor next', 'move-mouse window-force-center']
    shift-left = 'move-node-to-workspace --focus-follows-window prev'
    shift-right = 'move-node-to-workspace --focus-follows-window next'
    shift-up = 'move-node-to-monitor --focus-follows-window prev'
    shift-down = 'move-node-to-monitor --focus-follows-window next'
