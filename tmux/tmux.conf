# tmux.conf — mouse-first, beginner-friendly setup.
#
# Prefix: C-a, matching herdr. C-Space still works as a secondary leader.
set -g prefix C-a
set -g prefix2 C-Space
bind C-a send-prefix
bind C-Space send-prefix

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"          # truecolor support
set -g extended-keys on
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g history-limit 50000

# Reload this config
bind q source-file ~/.config/tmux/tmux.conf

# ---------------------------------------------------------------------------
# Mouse — everything clickable
# ---------------------------------------------------------------------------
set -g mouse on

# Scroll wheel: scroll up to enter copy mode, scroll down to go back.
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" \
  "select-pane -t =; copy-mode -e"
bind -n WheelDownPane select-pane -t =\; send-keys -M

# Right-click a tab to rename it. The prompt expands its initial text
# against the client's current window, so switch to the clicked tab
# first; ESC cancels the prompt.
bind -n MouseDown3Status switch-client -t =\; command-prompt -I "#W" "rename-window -- '%%'"

# Click a tab to select it (default tmux behavior, made explicit).
bind -n MouseDown1Status switch-client -t =

# Click the "+" button (right end of the status bar) to create a new tab.
# The click lands on the right status area, hence MouseDown1StatusRight;
# the position check keeps the rest of that area (clock etc.) inert.
bind -n MouseDown1StatusRight \
  if-shell -F '#{e|>=:#{mouse_x},#{e|-:#{client_width},5}}' \
    'new-window -c "#{pane_current_path}"'

# ---------------------------------------------------------------------------
# Tabs (windows)
# ---------------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"  # new tab
bind k kill-window                           # close tab
bind r command-prompt -I "#W" "rename-window -- '%%'"  # rename tab

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ---------------------------------------------------------------------------
# Panes (splits inside a tab)
# ---------------------------------------------------------------------------
bind h split-window -v -c "#{pane_current_path}"   # split below
bind v split-window -h -c "#{pane_current_path}"   # split right
bind x kill-pane

# Opt+arrows jump between panes; Opt+Shift+arrows resize.
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Opt+Enter split below, Opt+Shift+Enter split right, Opt+Esc close pane.
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane

# ---------------------------------------------------------------------------
# Copy mode (vi keys)
# ---------------------------------------------------------------------------
# Copy mode uses vi keys; the rename prompt keeps emacs keys so ESC
# cancels it (with vi keys, ESC enters command mode instead). status-keys
# must be forced: tmux otherwise derives it from $EDITOR (nvim -> vi).
setw -g mode-keys vi
set -g status-keys emacs
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Sessions
# ---------------------------------------------------------------------------
bind C new-session -c "#{pane_current_path}"
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

# ---------------------------------------------------------------------------
# Numbers & naming
# ---------------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 3000
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# ---------------------------------------------------------------------------
# Status bar — tabs at the top, clickable
# ---------------------------------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 60
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[fg=#89b4fa,bg=#181825]"
set -g status-right "#[fg=#89b4fa]#{?client_prefix, PREFIX ,}#[fg=#6c7086] %a %d %b %H:%M #[fg=#181825,bg=#313244]\ue0b6#[bg=#313244,fg=#89b4fa,bold] + #[fg=#313244,bg=#181825]\ue0b4"
set -g window-status-separator ""
set -g window-status-format "#[fg=#181825,bg=#313244]\ue0b6#[bg=#313244,fg=#a6adc8] #I:#W #[fg=#313244,bg=#181825]\ue0b4"
set -g window-status-current-format "#[fg=#181825,bg=#89b4fa]\ue0b6#[bg=#89b4fa,fg=#11111b,bold] #I:#W #[fg=#89b4fa,bg=#181825]\ue0b4"
set -g window-status-activity-style "fg=#fab387,bold"
set -g window-status-bell-style "fg=#11111b,bg=#f38ba8,bold"

# ---------------------------------------------------------------------------
# Colors
# ---------------------------------------------------------------------------
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#89b4fa,fg=#11111b"
setw -g clock-mode-colour "#89b4fa"

# ---------------------------------------------------------------------------
# Help
# ---------------------------------------------------------------------------
bind ? display-popup -E -w 80% -h 70% "less -R ~/.config/tmux/help.txt"
